<header class="header">
  <div class="brand-controls">
    <a class="logo" routerLink="/almacen/inicio" aria-label="VILAGRO, ir al inicio">
      <img src="assets/images/logovilagronobg.png" alt="" width="40" height="40">
      <span class="brand-name">VIL<span class="danger">AGRO</span></span>
    </a>
    <button class="toggle-button" type="button" (click)="sideNavToggled.emit()"
      [attr.aria-label]="toggleLabel" [title]="toggleLabel"
      [attr.aria-expanded]="navigationExpanded" aria-controls="primary-navigation">
      <mat-icon>{{ isMobile && navigationExpanded ? 'close' : 'menu' }}</mat-icon>
    </button>
  </div>

  <button type="button" class="account-button" [matMenuTriggerFor]="accountMenu"
    #accountTrigger="matMenuTrigger" [class.is-open]="accountTrigger.menuOpen"
    [attr.aria-label]="'Opciones de sesión de ' + accountLabel">
    <span class="account-avatar"><mat-icon>storefront</mat-icon></span>
    <span class="account-copy"><span class="account-caption">Sesión activa</span><strong>{{ accountLabel }}</strong></span>
    <mat-icon class="account-chevron">expand_more</mat-icon>
  </button>

  <mat-menu #accountMenu="matMenu" xPosition="before">
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>
</header>
